<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassShare</title>
<style>
:root{
  --header-bg:#172554;
  --accent:#2563eb;
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#eff6ff;
  --radius:14px;
  --font:'Segoe UI',Arial,sans-serif;
}
body.theme-emerald{--header-bg:#064e3b;--accent:#059669;--soft:#ecfdf5}
body.theme-purple{--header-bg:#3b0764;--accent:#7c3aed;--soft:#f5f3ff}
body.theme-coral{--header-bg:#7c2d12;--accent:#ea580c;--soft:#fff7ed}
body.theme-pink{--header-bg:#831843;--accent:#db2777;--soft:#fdf2f8}
body.theme-cyan{--header-bg:#164e63;--accent:#0891b2;--soft:#ecfeff}

body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --border:#334155;
  --soft:#1e3a8a;
}
body.dark.theme-emerald{--soft:#064e3b}
body.dark.theme-purple{--soft:#4c1d95}
body.dark.theme-coral{--soft:#7c2d12}
body.dark.theme-pink{--soft:#831843}
body.dark.theme-cyan{--soft:#155e75}

body.style-rounded{--radius:24px;--font:'Trebuchet MS',sans-serif}
body.style-compact{--radius:6px;--font:system-ui,sans-serif}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);transition:background .2s,color .2s}

/* En-tête + Barre d'interface enrichie tout en haut */
header{background:var(--header-bg);color:white;padding:20px 20px 14px;transition:background .25s}
.header-inner{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h1{margin:0;font-size:26px}
header p{margin:4px 0 0;opacity:.9;font-size:14px}

.top-bar{background:rgba(0,0,0,.25);padding:9px 20px;border-top:1px solid rgba(255,255,255,.1)}
.top-bar-inner{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:13px;color:white}
.theme-dots{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dot{width:21px;height:21px;border-radius:50%;border:2px solid white;cursor:pointer;transition:transform .15s;padding:0;margin:0}
.dot:hover,.dot.active{transform:scale(1.22);box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.view-switches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.top-pill{background:rgba(255,255,255,.16);color:white;border:1px solid rgba(255,255,255,.28);padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;margin:0}
.top-pill:hover,.top-pill.active{background:white;color:#0f172a;font-weight:bold}

main{max-width:980px;margin:20px auto;padding:12px}
section{background:var(--card);padding:18px;border-radius:var(--radius);margin-bottom:16px;border:2px solid transparent;transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
section.dragover-area{border-color:var(--accent);background:var(--soft)}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:calc(var(--radius) * 0.6);font:inherit;font-size:16px}
button{background:var(--accent);color:white;border:0;padding:11px 15px;border-radius:calc(var(--radius) * 0.6);cursor:pointer;margin:4px 4px 4px 0;font-size:15px;transition:opacity .15s,background .2s}
button:hover{opacity:.88}
.danger{background:#dc2626}
.secondary{background:#64748b}

.folder{display:inline-flex;align-items:center;gap:6px;background:var(--soft);padding:10px 14px;margin:4px;border-radius:calc(var(--radius) * 0.7);cursor:pointer;border:2px dashed transparent;transition:.15s;user-select:none;font-size:14px}
.folder.active{outline:2px solid var(--accent);font-weight:bold}
.folder.dragover{border-color:var(--accent);transform:scale(1.05)}
.folder-count{background:var(--card);color:var(--text);padding:1px 7px;border-radius:12px;font-size:12px;font-weight:bold}

.dropzone{border:2px dashed #93c5fd;background:var(--bg);padding:22px;text-align:center;border-radius:var(--radius);margin:10px 0;cursor:pointer;color:var(--muted);transition:.15s}
.dropzone.dragover{border-color:var(--accent);background:var(--soft);color:var(--text)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.toolbar select{width:auto;padding:9px 12px;margin:0;font-size:14px}
.checkbox-label{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none;background:var(--bg);padding:7px 11px;border-radius:8px;border:1px solid var(--border)}
.checkbox-label input{width:auto;margin:0}

.folder-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:15px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.folder-bar h3{margin:0}

/* Cartes auto-adaptatives */
#documents{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
#documents.list-view{flex-direction:column}
#documents.list-view .doc{width:100%}

.
