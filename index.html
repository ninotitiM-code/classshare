<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassShare</title>
<style>
:root{
  --header-bg:#172554;
  --accent:#2563eb;
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --soft:#eff6ff;
}
body.theme-emerald{
  --header-bg:#064e3b;
  --accent:#059669;
  --soft:#ecfdf5;
}
body.theme-purple{
  --header-bg:#3b0764;
  --accent:#7c3aed;
  --soft:#f5f3ff;
}
body.theme-coral{
  --header-bg:#7c2d12;
  --accent:#ea580c;
  --soft:#fff7ed;
}
body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --border:#334155;
  --soft:#1e3a8a;
}
body.dark.theme-emerald{--soft:#064e3b}
body.dark.theme-purple{--soft:#4c1d95}
body.dark.theme-coral{--soft:#7c2d12}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;transition:background .2s,color .2s}

/* En-tête + Barre d'interface tout en haut */
header{background:var(--header-bg);color:white;padding:20px 20px 16px;transition:background .25s}
.header-inner{max-width:950px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h1{margin:0;font-size:26px}
header p{margin:4px 0 0;opacity:.9;font-size:14px}

.top-bar{background:rgba(0,0,0,.22);padding:8px 20px}
.top-bar-inner{max-width:950px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:13px;color:white}
.theme-dots{display:flex;align-items:center;gap:8px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid white;cursor:pointer;transition:transform .15s;padding:0;margin:0}
.dot:hover{transform:scale(1.18)}
.view-switches{display:flex;gap:6px;align-items:center}
.top-pill{background:rgba(255,255,255,.16);color:white;border:1px solid rgba(255,255,255,.28);padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;margin:0}
.top-pill:hover,.top-pill.active{background:white;color:#0f172a;font-weight:bold}

main{max-width:950px;margin:20px auto;padding:12px}
section{background:var(--card);padding:18px;border-radius:14px;margin-bottom:16px;border:2px solid transparent;transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
section.dragover-area{border-color:var(--accent);background:var(--soft)}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;font:inherit;font-size:16px}
button{background:var(--accent);color:white;border:0;padding:11px 15px;border-radius:8px;cursor:pointer;margin:4px 4px 4px 0;font-size:15px;transition:opacity .15s,background .2s}
button:hover{opacity:.88}
.danger{background:#dc2626}
.secondary{background:#64748b}

.folder{display:inline-flex;align-items:center;gap:6px;background:var(--soft);padding:10px 14px;margin:4px;border-radius:10px;cursor:pointer;border:2px dashed transparent;transition:.15s;user-select:none;font-size:14px}
.folder.active{outline:2px solid var(--accent);font-weight:bold}
.folder.dragover{border-color:var(--accent);transform:scale(1.05)}
.folder-count{background:var(--card);color:var(--text);padding:1px 7px;border-radius:12px;font-size:12px;font-weight:bold}

.dropzone{border:2px dashed #93c5fd;background:var(--bg);padding:22px;text-align:center;border-radius:12px;margin:10px 0;cursor:pointer;color:var(--muted);transition:.15s}
.dropzone.dragover{border-color:var(--accent);background:var(--soft);color:var(--text)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.toolbar select{width:auto;padding:9px 12px;margin:0;font-size:14px}
.checkbox-label{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none}
.checkbox-label input{width:auto;margin:0}

.folder-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:15px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.folder-bar h3{margin:0}

/* Modes d'affichage des documents */
#documents{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
#documents.list-view{flex-direction:column}
#documents.list-view .doc{width:100%}

.doc{
  padding:14px 16px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  width:fit-content;
  min-width:240px;
  max-width:100%;
  word-break:break-word;
  transition:transform .12s,box-shadow .12s;
}
.doc:hover{box-shadow:0 4px 12px rgba(0,0,0,.06)}
.doc.has-text{width:100%}
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.doc-folder-tag{font-size:11px;background:var(--soft);color:var(--accent);padding:2px 7px;border-radius:6px;font-weight:bold}
body.dark .doc-folder-tag{color:#93c5fd}
.doc-content{white-space:pre-wrap;margin:8px 0;line-height:1.45}
.doc-preview-img{max-width:100%;max-height:220px;border-radius:8px;margin-top:8px;display:block;border:1px solid var(--border);cursor:zoom-in}

.file-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.file-link{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;background:var(--soft);color:var(--accent);text-decoration:none;border-radius:8px;font-weight:bold;font-size:13px}
body.dark .file-link{color:#93c5fd}
.file-link:hover{opacity:.85}
.copy-btn{padding:7px 10px;font-size:13px;margin:0;background:var(--border);color:var(--text)}
.size-tag{font-weight:normal;color:var(--muted);font-size:12px}
small{color:var(--muted)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}
nav button.active-tab{outline:2px solid var(--text);font-weight:bold}
.hidden{display:none!important}
.status{padding:10px 12px;background:var(--soft);border-radius:8px;margin:10px 0;font-weight:bold;font-size:14px}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:bold;background:var(--soft);color:var(--accent);margin-left:8px}
body.dark .badge{color:#93c5fd}

.panel-box{border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:16px;background:var(--bg)}
.panel-box h3{margin-top:0}
.row-item{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.row-item:last-child{border-bottom:none}
.row-item select{width:auto;padding:7px 10px;margin:0;font-size:14px}
.color-picker-row{display:flex;align-items:center;gap:12px;margin:8px 0}
.color-picker-row input[type="color"]{width:60px;height:42px;padding:2px;cursor:pointer}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-card strong{display:block;font-size:22px;color:var(--accent)}

@media (max-width: 600px) {
  main{margin:10px auto;padding:10px}
  section{padding:14px}
  nav button{flex:1;text-align:center;padding:12px 6px;margin:0;font-size:14px}
  .doc{width:100%;min-width:0}
  .file-link{flex:1;justify-content:center}
  .quick-upload-btn{width:100%}
  .top-bar-inner{justify-content:center}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1 id="siteTitle">📚 ClassShare</h1>
      <p id="siteSubtitle">Le partage des connaissances.</p>
    </div>
  </div>
</header>

<div class="top-bar">
  <div class="top-bar-inner">

      <span>Couleur :</span>
      <button class="dot" data-theme="default" style="background:#2563eb" title="Bleu Classique"></button>
      <button class="dot" data-theme="emerald" style="background:#059669" title="Vert Émeraude"></button>
      <button class="dot" data-theme="purple" style="background:#7c3aed" title
